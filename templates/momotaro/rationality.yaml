kappa: 0.0          # Stage 2 既定は OFF。GPU 復旧後の計測で method と合わせて決める
method: noul
backend:
  type: ollama
  model: qwen3.6:35b
  base_url: http://localhost:11434
  timeout: 300
  thermal_guard:  # 2026-09-19追記: このマシンは連続負荷で86℃・GPU lostを起こした実績がある
    max_temp: 82
    cooldown_seconds: 45
    check_every: 10
max_judge_calls_per_run: null  # 1 run(seed)あたりの判定器呼び出し上限。null=無制限（--rationality-max-calls で上書き可）
key_items:
  - きびだんご
common_knowledge:
  - きびだんごを渡すと相手は仲間になりやすい
  - 仲間は戦いで力を貸してくれる
  - 鬼ヶ島へ渡るには船が要る
  - 鬼は宝物を守っており、倒すか説得しなければ宝物は手に入らない
  - 相手を観察すると弱点や隠し持つ力が分かることがある
