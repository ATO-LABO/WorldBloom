name: tests

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    # The complete Windows lifecycle suite takes about 29 minutes on hosted
    # runners; allow setup/runner variance without changing per-job deadlines.
    timeout-minutes: 45
    env:
      # Japanese CLI output must also work on English Windows runners.
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline regression tests
        run: python -B -m unittest discover -s tests -v
