name: tests

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    # The complete Windows lifecycle suite takes about 29 minutes on hosted
    # runners; allow setup/runner variance without changing per-job deadlines.
    timeout-minutes: 45
    env:
      # Japanese CLI output must also work on English Windows runners.
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      WB_REGRESSION_DIAGNOSTICS: '1'
      WB_REGRESSION_PHASE: full-suite
      # The full-suite gate uses the original worker/DEVNULL. Before-full probes
      # opt into capture; after-full probes compare the original worker/harness.
      WB_EPOCH_CAPTURE_STDERR: '0'
      MELOS_APPROVED_ADAPTER_DIR: ${{ github.workspace }}/execution/approved_melos_sources
      MELOS_INPUT_DIR: ${{ github.workspace }}/projects/melos-input
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Observe the runner's Node runtime
        run: node --version
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Observe Windows targets before the full suite
        if: runner.os == 'Windows'
        env:
          WB_REGRESSION_EVIDENCE_DIR: ${{ runner.temp }}/worldbloom-regression-evidence
        run: python -B tests/windows_regression_probe.py --phase before-full
      - name: Run offline regression tests
        env:
          WB_REGRESSION_EVIDENCE_DIR: ${{ runner.temp }}/worldbloom-regression-evidence
        run: python -B tests/regression_suite_capture.py
      - name: Run offline JavaScript contracts
        run: node scripts/test_javascript.cjs
      - name: Compare original Windows targets after the full suite
        if: always() && runner.os == 'Windows'
        env:
          WB_REGRESSION_EVIDENCE_DIR: ${{ runner.temp }}/worldbloom-regression-evidence
        run: python -B tests/windows_regression_probe.py --phase original-after-full
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-diagnostics-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/worldbloom-regression-evidence
          if-no-files-found: ignore
          retention-days: 7
