name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      full: ${{ steps.plan.outputs.full }}
      windows: ${{ steps.plan.outputs.windows }}
      tested_sha: ${{ steps.plan.outputs.tested_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Classify immutable base/head and tested tree
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B .github/ci/ci_plan.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: policy-plan-a${{ github.run_attempt }}
          path: policy-plan.json
          if-no-files-found: error
          retention-days: 1

  basic:
    needs: classify
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      WB_SOURCE_HEAD: ${{ needs.classify.outputs.tested_sha }}
      WB_CI_ENVIRONMENT: windows-latest-py3.13
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Syntax, policy and workflow structure
        id: syntax
        run: python -B .github/ci/ci_contract.py
      - name: Complete selected basic modules
        id: python
        run: python -B .github/ci/ci_selected.py basic --report policy-basic/selected-result.json
      - name: Offline JavaScript contracts
        id: javascript
        run: node scripts/test_javascript.cjs
      - name: Record every required step outcome
        if: always()
        env:
          WB_PYTHON_OUTCOME: ${{ steps.python.outcome }}
          WB_SYNTAX_OUTCOME: ${{ steps.syntax.outcome }}
          WB_JAVASCRIPT_OUTCOME: ${{ steps.javascript.outcome }}
        run: python -B .github/ci/ci_outcomes.py basic --output policy-basic/selected-outcomes.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: policy-basic-a${{ github.run_attempt }}
          path: |
            policy-basic/selected-result.json
            policy-basic/selected-outcomes.json
          if-no-files-found: error
          retention-days: 1

  windows-related:
    needs: classify
    if: needs.classify.outputs.windows == 'true'
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      WB_SOURCE_HEAD: ${{ needs.classify.outputs.tested_sha }}
      WB_CI_ENVIRONMENT: windows-latest-py${{ matrix.python }}
      WB_EPOCH_CAPTURE_STDERR: '0'
      MELOS_APPROVED_ADAPTER_DIR: ${{ github.workspace }}/execution/approved_melos_sources
      MELOS_INPUT_DIR: ${{ github.workspace }}/projects/melos-input
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Complete Windows-related selected modules
        id: python
        run: python -B .github/ci/ci_selected.py windows --report policy-windows/selected-result.json
      - if: always()
        env:
          WB_PYTHON_OUTCOME: ${{ steps.python.outcome }}
        run: python -B .github/ci/ci_outcomes.py windows --output policy-windows/selected-outcomes.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: policy-windows-py${{ matrix.python }}-a${{ github.run_attempt }}
          path: |
            policy-windows/selected-result.json
            policy-windows/selected-outcomes.json
          if-no-files-found: error
          retention-days: 1

  regression-shard:
    needs: classify
    if: needs.classify.outputs.full == 'true' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
        shard: [0, 1]
    runs-on: ${{ matrix.os }}
    # The full census is partitioned into two isolated jobs; product deadlines
    # and assertions are unchanged. The four aggregate gates verify coverage.
    timeout-minutes: 45
    env:
      # Japanese CLI output must also work on English Windows runners.
      WB_SOURCE_HEAD: ${{ needs.classify.outputs.tested_sha }}
      WB_CI_ENVIRONMENT: ${{ matrix.os }}-py${{ matrix.python }}
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      WB_REGRESSION_DIAGNOSTICS: '1'
      WB_REGRESSION_PHASE: full-suite
      # Preserve child stderr from the failing full-suite invocation. Capture
      # changes only its test copy; after-full probes retain the original worker.
      WB_EPOCH_CAPTURE_STDERR: '1'
      MELOS_APPROVED_ADAPTER_DIR: ${{ github.workspace }}/execution/approved_melos_sources
      MELOS_INPUT_DIR: ${{ github.workspace }}/projects/melos-input
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Observe the runner's Node runtime
        run: node --version
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Observe Windows targets before the full suite
        id: before
        if: runner.os == 'Windows' && matrix.shard == 0
        env:
          WB_REGRESSION_EVIDENCE_DIR: ${{ runner.temp }}/worldbloom-regression-evidence
        run: python -B tests/windows_regression_probe.py --phase before-full
      - name: Run offline regression tests
        id: python
        env:
          WB_REGRESSION_EVIDENCE_DIR: ${{ runner.temp }}/worldbloom-regression-evidence
        run: python -B tests/regression_suite_capture.py --shard ${{ matrix.shard }}
      - name: Run offline JavaScript contracts
        id: javascript
        if: matrix.shard == 0
        run: node scripts/test_javascript.cjs
      - name: Compare original Windows targets after the full suite
        id: after
        if: always() && runner.os == 'Windows' && matrix.shard == 0
        env:
          WB_REGRESSION_EVIDENCE_DIR: ${{ runner.temp }}/worldbloom-regression-evidence
        run: python -B tests/windows_regression_probe.py --phase original-after-full
      - name: Save required step outcomes for the aggregate gate
        if: always()
        env:
          WB_REGRESSION_EVIDENCE_DIR: ${{ runner.temp }}/worldbloom-regression-evidence
          WB_PYTHON_OUTCOME: ${{ steps.python.outcome }}
          WB_JAVASCRIPT_OUTCOME: ${{ steps.javascript.outcome }}
          WB_BEFORE_OUTCOME: ${{ steps.before.outcome }}
          WB_AFTER_OUTCOME: ${{ steps.after.outcome }}
        run: python -B -c "import json,os,pathlib; p=pathlib.Path(os.environ['WB_REGRESSION_EVIDENCE_DIR']); p.mkdir(parents=True,exist_ok=True); (p/'gate-outcomes.json').write_text(json.dumps({k:os.environ['WB_'+k.upper()+'_OUTCOME'] for k in ('python','javascript','before','after')}),encoding='utf-8')"
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: regression-diagnostics-${{ matrix.os }}-py${{ matrix.python }}-part-${{ matrix.shard }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/worldbloom-regression-evidence
          if-no-files-found: ignore
          retention-days: 7

  regression:
    # Keep the existing four required check names. A shard success alone is not
    # a full-suite pass; each gate checks both reports and exact census union.
    needs: [classify, basic, regression-shard, secrets]
    if: always() && (needs.classify.result != 'success' || needs.classify.outputs.full == 'true' || (github.event_name == 'pull_request' && github.base_ref == 'main'))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WB_SOURCE_HEAD: ${{ needs.classify.outputs.tested_sha }}
      WB_CI_ENVIRONMENT: ${{ matrix.os }}-py${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: regression-diagnostics-${{ matrix.os }}-py${{ matrix.python }}-part-*-a${{ github.run_attempt }}
          path: regression-evidence
      - name: Require every shard and secret check to succeed
        env:
          WB_CLASSIFICATION: ${{ needs.classify.result }}
          WB_BASIC: ${{ needs.basic.result }}
          WB_SHARDS: ${{ needs.regression-shard.result }}
          WB_SECRETS: ${{ needs.secrets.result }}
        run: python -B -c "import os; assert all(os.environ[k]=='success' for k in ('WB_CLASSIFICATION','WB_BASIC','WB_SHARDS','WB_SECRETS'))"
      - name: Require complete successful census for this environment
        run: python -B tests/regression_partition.py --aggregate regression-evidence --output census-verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: regression-census-${{ matrix.os }}-py${{ matrix.python }}-a${{ github.run_attempt }}
          path: census-verification.json
          if-no-files-found: error
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        run: bash .github/scripts/install-gitleaks.sh
      - name: Scan reachable history and the working tree
        run: |
          gitleaks git . --redact=100 --no-banner --log-opts="--all"
          gitleaks dir . --redact=100 --no-banner
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Check public samples
        run: python scripts/publication_guard.py samples

  ci-policy:
    name: ci-policy
    needs: [classify, basic, windows-related, regression, secrets]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      WB_NEEDS: ${{ toJSON(needs) }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install --no-cache-dir -r requirements.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: policy-*-a${{ github.run_attempt }}
          path: policy-evidence
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.classify.outputs.full == 'true'
        with:
          pattern: regression-census-*-a${{ github.run_attempt }}
          path: policy-evidence
      - name: Fail closed on classification, jobs and complete census
        run: python -B .github/ci/ci_gate.py --evidence policy-evidence --receipt ci-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: policy-receipt-a${{ github.run_attempt }}
          path: ci-receipt.json
          if-no-files-found: error
          retention-days: 1
