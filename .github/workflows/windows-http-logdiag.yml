name: windows-http-logdiag

on:
  push:
    branches: [codex/windows-http-logdiag-20261016]

permissions:
  contents: read

jobs:
  original-shard:
    if: github.run_attempt == 1 && github.event.repository.private == false
    runs-on: windows-2025
    timeout-minutes: 34
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PIP_NO_CACHE_DIR: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Record bound origin and mask runner paths
        shell: pwsh
        run: |
          $taskStarted = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          "WB_DIAG_STARTED_MS=$taskStarted" >> $env:GITHUB_ENV
          $taskPrefixes = @($env:GITHUB_WORKSPACE, $env:RUNNER_WORKSPACE, $env:RUNNER_TEMP, $env:RUNNER_TOOL_CACHE, $env:USERPROFILE)
          foreach ($taskPrefix in $taskPrefixes) {
            if ($taskPrefix) {
              Write-Output "::add-mask::$taskPrefix"
              Write-Output "::add-mask::$($taskPrefix.Replace('\', '/'))"
              Write-Output "::add-mask::$($taskPrefix.Replace('\', '\\'))"
            }
          }
          Write-Output "WB_DIAG_BOUND_ORIGIN_MS=$taskStarted"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.16'
          architecture: x64
      - name: Install pinned runtime dependency without cache
        run: python -m pip install --no-cache-dir --disable-pip-version-check --quiet PyYAML==6.0.3
      - name: Observe the fixed original shard once and emit safe ordinary logs
        shell: pwsh
        run: python -I -B .github/diagnostics/http-progress/controller.py
