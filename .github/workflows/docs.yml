name: docs

on:
  push:
    branches: [main]
    paths:
      - "docsite/**"
      - ".github/workflows/docs.yml"
      - ".github/scripts/**"
      - "scripts/**"
      - "viewer/server.py"
      - "requirements.txt"
  pull_request:
    paths:
      - "docsite/**"
      - ".github/workflows/docs.yml"
      - ".github/scripts/**"
      - "scripts/**"
      - "viewer/server.py"
      - "requirements.txt"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt -r docsite/requirements.txt

      - name: Check docs freshness (ja/en parity, translation/review staleness, CLI snippets)
        run: python docsite/check.py

      # -d is resolved relative to the config file, so ../_site lands at the
      # repo root. ja first: its build cleans _site, which would wipe en.
      - name: Build ja site
        run: mkdocs build --strict -f docsite/mkdocs.ja.yml -d ../_site

      - name: Build en site (into ja site's /en)
        run: mkdocs build --strict -f docsite/mkdocs.en.yml -d ../_site/en

      - name: Install checksum-verified Gitleaks
        run: bash .github/scripts/install-gitleaks.sh

      - name: Check publication content before uploading
        run: |
          python scripts/publication_guard.py _site
          gitleaks dir _site --redact=100 --no-banner

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-site
          path: _site
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docs-site
          path: _site

      - name: Deploy to gh-pages/docs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages
          git worktree add ghp origin/gh-pages

          # Refuse to touch gh-pages if it doesn't look like the existing
          # published viewer (never run mkdocs gh-deploy here: that would
          # wipe the whole branch, including the public viewer).
          test -f ghp/index.html

          rm -rf ghp/docs
          cp -r _site ghp/docs

          cd ghp
          git add docs
          if git diff --cached --quiet; then
            echo "No docs changes to publish."
            exit 0
          fi
          git commit -m "docs: publish docsite build ($GITHUB_SHA)"
          git push origin HEAD:gh-pages
