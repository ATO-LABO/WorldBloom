name: security

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        run: bash .github/scripts/install-gitleaks.sh
      - name: Scan reachable history and the working tree
        run: |
          gitleaks git . --redact=100 --no-banner --log-opts="--all"
          gitleaks dir . --redact=100 --no-banner
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Check public samples
        run: python scripts/publication_guard.py samples
