name: release-build-v2-studio

on:
  push:
    branches: [codex/windows-v2-release-20261107]

permissions:
  contents: read

jobs:
  windows-candidate:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 3ce8fbf376e25eaea533bdc69c6a8c80e121e390
          path: release-source
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Create isolated build environment and record PyPI resolution
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP/wb-build-venv"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = "$env:RUNNER_TEMP/wb-build-venv/Scripts/python.exe"
          & $python -m pip --isolated install --index-url https://pypi.org/simple --no-cache-dir --report "$env:RUNNER_TEMP/pip-install-report.json" -r controller/release/requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip freeze --all | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/build-requirements-resolved.txt"
          "$env:RUNNER_TEMP/wb-build-venv/Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Test candidate packaging contracts
        shell: pwsh
        run: |
          python -B controller/tests/test_release_package.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preflight required redistribution notices before compiling
        shell: pwsh
        run: |
          python -B controller/scripts/collect_release_licenses.py --output "$env:RUNNER_TEMP/license-preflight"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B controller/scripts/scan_release_publication.py --guard release-source/scripts/publication_guard.py "$env:RUNNER_TEMP/license-preflight"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Studio executable from fixed application source
        shell: pwsh
        run: |
          python -B controller/scripts/build_windows_release.py --source release-source --output "$env:RUNNER_TEMP/worldbloom-build"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record actual unsigned status
        shell: pwsh
        run: |
          $result = @{}
          foreach ($name in @('WorldBloom-Studio')) {
            $result[$name] = (Get-AuthenticodeSignature "$env:RUNNER_TEMP/worldbloom-build/dist/$name.exe").Status.ToString()
            if ($result[$name] -ne 'NotSigned') { throw 'Unexpected signature state' }
          }
          $result | ConvertTo-Json | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/signatures.json"
      - name: Assemble manifests and verify the Studio ZIP
        shell: pwsh
        run: |
          python -B controller/scripts/package_release.py build --source release-source --build "$env:RUNNER_TEMP/worldbloom-build" --output "$env:RUNNER_TEMP/worldbloom-candidate" --signatures "$env:RUNNER_TEMP/signatures.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B controller/scripts/scan_release_publication.py --guard release-source/scripts/publication_guard.py "$env:RUNNER_TEMP/worldbloom-candidate"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Launch extracted Windows executables in disposable directories
        shell: pwsh
        run: |
          & controller/scripts/windows_release_smoke.ps1 -Candidates "$env:RUNNER_TEMP/worldbloom-candidate" -Output "$env:RUNNER_TEMP/worldbloom-smoke" -Packager "$env:GITHUB_WORKSPACE/controller/scripts/package_release.py" -PayloadValidator "$env:GITHUB_WORKSPACE/controller/scripts/validate_release_payload.py"
      - name: Stage the exact public artifact file set
        shell: pwsh
        run: |
          python -B controller/scripts/stage_release_evidence.py --temp "$env:RUNNER_TEMP" --output "$env:RUNNER_TEMP/upload-evidence"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Scan every staged file and extracted payload before any artifact upload
        shell: pwsh
        run: |
          foreach ($file in (Get-ChildItem -Recurse -File "$env:RUNNER_TEMP/upload-evidence")) {
            python -B controller/scripts/scan_release_publication.py --guard release-source/scripts/publication_guard.py $file.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python -B controller/scripts/scan_release_publication.py --guard release-source/scripts/publication_guard.py "$env:RUNNER_TEMP/worldbloom-candidate/WorldBloom-Studio"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = "$env:RUNNER_TEMP/gitleaks_8.30.1_windows_x64.zip"
          Invoke-WebRequest 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e') { throw 'Gitleaks checksum mismatch' }
          Expand-Archive $archive "$env:RUNNER_TEMP/gitleaks-verified"
          foreach ($folder in @('upload-evidence', 'worldbloom-candidate/WorldBloom-Studio')) {
            & "$env:RUNNER_TEMP/gitleaks-verified/gitleaks.exe" dir "$env:RUNNER_TEMP/$folder" --redact=100 --no-banner
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Upload already scanned candidates and measured evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-v2.0.0-candidate
          path: ${{ runner.temp }}/upload-evidence/
          if-no-files-found: error
          retention-days: 7

  scan-candidate:
    needs: windows-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-v2.0.0-candidate
          path: candidate-evidence
      - name: Install existing checksum-verified Gitleaks
        run: bash .github/scripts/install-gitleaks.sh
      - name: Verify and scan exact candidate ZIP bytes
        run: |
          set -euo pipefail
          cd candidate-evidence/worldbloom-candidate
          sha256sum --check SHA256SUMS.txt
          cd ../..
          find candidate-evidence -type f -print0 | while IFS= read -r -d '' file; do
            python -B scripts/scan_release_publication.py --guard scripts/publication_guard.py "$file"
          done
          gitleaks dir candidate-evidence --redact=100 --no-banner
          for mode in WorldBloom-Studio; do
            python -B scripts/package_release.py extract "candidate-evidence/worldbloom-candidate/$mode-portable.zip" "scan/$mode"
            python -B scripts/scan_release_publication.py --guard scripts/publication_guard.py "scan/$mode" "candidate-evidence/worldbloom-candidate/$mode-portable.zip"
            gitleaks dir "scan/$mode" --redact=100 --no-banner
          done
      - name: Preserve scanned candidate without publishing or tagging
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: worldbloom-v2.0.0-reviewed-candidate
          path: candidate-evidence
          if-no-files-found: error
          retention-days: 7
