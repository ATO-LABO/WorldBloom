evidence:
- id: S1
  anchor: メロスは村の牧人である
  type: narrator
  facts:
  - 牧人
  - 妹16歳
  - 妹の婚約者は牧人
  - 友は石工
  - シラクスから村まで十里
- id: S2
  anchor: 三日目には日没までに帰って来い
  type: King_speech
  facts:
  - 人質セリヌンティウス
  - 期限日没
  - 遅刻なら友処刑
  - 遅刻ならメロス放免という王の発言
- id: S3
  anchor: メロスは、友に一切の事情を語った
  type: narrator
  facts:
  - 友は事情を知り承諾
  - 出発は深夜
- id: S4
  anchor: 市に用事を残して来た
  type: Melos_speech
  facts:
  - 妹へ市の用事と説明
  - 死刑と人質を妹へ明かしていない
- id: S5
  anchor: 葡萄の季節まで待ってくれ
  type: Groom_speech
  facts:
  - 婿は準備不足を理由に婚礼前倒しへ抵抗
- id: S6
  anchor: 結婚式は、真昼に行われた
  type: narrator
  facts:
  - 第2日真昼婚礼
  - 豪雨
  - 宴
  - 眠り
  - 第3日薄明出発
- id: S7
  anchor: 繋舟は残らず浪に浚われて影なく
  type: narrator
  facts:
  - 橋破壊
  - 舟流失
  - 渡守り不在
  - 激流を泳いで渡る
- id: S8
  anchor: さては、王の命令で
  type: Melos_suspicion
  facts:
  - 王の差し金という疑いのみ。山賊と王の関係は世界事実にしない
- id: S9
  anchor: その、いのちが欲しいのだ
  type: Bandit_speech
  facts:
  - 山賊は命を要求
  - メロスは棍棒を奪い三人を倒す
- id: S10
  anchor: 岩の裂目
  type: narrator
  facts:
  - 疲労で倒れる
  - 泉を聞き水を飲む
  - 再び走る
- id: S11
  anchor: フィロストラトスでございます
  type: reported
  facts:
  - 弟子が刑場情報を伝える
  - まだ陽が沈まないというメロスの判断
- id: S12
  anchor: まさに最後の一片の残光も
  type: narrator
  facts:
  - 原作では間に合う
  - 友解放
  - 互いに一度疑ったと告白
  - 王が信実を認める
