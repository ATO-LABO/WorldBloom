assumptions:
- id: A1
  text: 時刻・各地点の分割・移動分数・体力100点は計算用の仮定。原作の測定値ではない。
- id: A2
  text: 洪水と山賊は固定環境条件。メロスが遭遇前に未来の洪水・山賊を知ることはない。
- id: A3
  text: 泳力閾値35、泳ぎ40点、戦闘閾値20、戦闘28点、水35点回復は仮定。成功を保証しない。
- id: A4
  text: 渡河を待っても観測期間中に水位は下がらない仮定。舟・馬・通信機・超自然救済は追加しない。
- id: A5
  text: 退却は既知の来た道を逆行する。600分の浅瀬迂回は設定変更群にだけ置く未確認の地形。
- id: A6
  text: 初期の人質合意は原作の既成事実として注入。帰還申出は2分作業で表し約束台帳が実完了を判定する。
- id: A7
  text: 王は帰還時に人質を解放しメロスへ刑を移す、期限を超えると友を処刑する仮定。赦免は別選択。
- id: A8
  text: 婚礼参加は双方の承諾＋第2日真昼開始の120分作業へ抽象化。儀式内の詳細は生成しない。
- id: A9
  text: 王・友・妹・婿の選択重みは原作からの解釈を数値化した仮説。実人間の確率ではない。
- id: A10
  text: 初期政治動機、妹の生活、王の後の統治、処刑後の村の反応は観測外。成功・不成功を補完しない。
- id: A11
  text: 最後の群衆は刑の準備開始後の王前へだけ存在する仮定。弟子は城で見た準備を30分歩いて伝える。
- id: A12
  text: geneは人物別の判断順序32枠。枝の有無で枠の意味は変わる。人格と世界値はGAで変異させない。
