concerns:
  version: 2
  conditions:
  - id: 出演-蒼-失効
    label: 出演-蒼が履行不能と分かった
    test:
      kind: promise
      promise: 出演-蒼
      version: 1
      statuses:
      - breached
      - cancelled
      - renegotiated
    mode: achieve
    visibility: observed
  - id: 出演-蒼
    label: 出演の約束を守る
    test:
      kind: promise
      promise: 出演-蒼
      version: 1
      statuses:
      - fulfilled
    mode: achieve
    visibility: observed
  - id: 出演-蓮-失効
    label: 出演-蓮が履行不能と分かった
    test:
      kind: promise
      promise: 出演-蓮
      version: 1
      statuses:
      - breached
      - cancelled
      - renegotiated
    mode: achieve
    visibility: observed
  - id: 出演-蓮
    label: 相手役として出演する
    test:
      kind: promise
      promise: 出演-蓮
      version: 1
      statuses:
      - fulfilled
    mode: achieve
    visibility: observed
  - id: 進行-紗季-失効
    label: 進行-紗季が履行不能と分かった
    test:
      kind: promise
      promise: 進行-紗季
      version: 1
      statuses:
      - breached
      - cancelled
      - renegotiated
    mode: achieve
    visibility: observed
  - id: 進行-紗季
    label: 開演時刻を守る
    test:
      kind: promise
      promise: 進行-紗季
      version: 1
      statuses:
      - fulfilled
    mode: achieve
    visibility: observed
  - id: 展示-写真-失効
    label: 展示-写真が履行不能と分かった
    test:
      kind: promise
      promise: 展示-写真
      version: 1
      statuses:
      - breached
      - cancelled
      - renegotiated
    mode: achieve
    visibility: observed
  - id: 展示-写真
    label: 共同展示への責任を果たす
    test:
      kind: promise
      promise: 展示-写真
      version: 1
      statuses:
      - fulfilled
    mode: achieve
    visibility: observed
  - id: 衣装が整う
    label: 衣装が整う
    test:
      kind: task
      task: costume-ready
      minimum: 1
    mode: achieve
    visibility: observed
  - id: 主役の稽古済み
    label: 主役の稽古済み
    test:
      kind: task
      task: practice-ready
      minimum: 1
    mode: achieve
    visibility: observed
  - id: 準備不足を避ける
    label: 不十分な出来を見せないための準備
    test:
      kind: task
      task: practice-ready
      minimum: 1
    mode: achieve
    visibility: observed
  - id: 音響を整える
    label: 演劇準備を整える
    test:
      kind: task
      task: sound-ready
      minimum: 1
    mode: achieve
    visibility: observed
  - id: 共同展示完成
    label: 共同展示パネルを完成させる
    test:
      kind: task
      task: panel-photo
      minimum: 1
    mode: achieve
    visibility: observed
  - id: 会場調整
    label: 会場を調整する
    test:
      kind: task
      task: venue-ready
      minimum: 1
    mode: achieve
    visibility: observed
  - id: 放送準備
    label: 案内放送を準備する
    test:
      kind: task
      task: broadcast-ready
      minimum: 1
    mode: achieve
    visibility: observed
  - id: 台詞相談-approved
    label: 台詞相談の実際のapproved
    test:
      kind: state
      key: 台詞相談結果
      equals: approved
    mode: achieve
    visibility: observed
  - id: 台詞相談-rejected
    label: 台詞相談の実際のrejected
    test:
      kind: state
      key: 台詞相談結果
      equals: rejected
    mode: achieve
    visibility: observed
  - id: 台詞相談-deferred
    label: 台詞相談の実際のdeferred
    test:
      kind: state
      key: 台詞相談結果
      equals: deferred
    mode: achieve
    visibility: observed
  - id: 台詞短縮を相談
    label: 終盤の一台詞の短縮を相談する
    test:
      kind: state
      key: 台詞相談結果
      equals: approved
    mode: achieve
    visibility: observed
