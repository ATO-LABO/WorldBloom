overview: 文化祭当日の朝。蒼は出演の準備と共同展示の約束を両立させたい。六人はそれぞれの目的と実際に受け取った情報から行動を選ぶ。
planning:
  version: 1
  actors:
  - 蒼
  - 紗季
  - 蓮
  - 灯
  - 悠
  - 実
  max_depth: 18
  max_nodes: 4096
deliberation:
  version: 1
  state:
    台詞相談結果: pending
  proposals:
  - id: line-change
    title: 終盤の一台詞を短くする相談
    place: 部室
    proposer: 蓮
    authority: 蒼
    reviewers:
    - 蒼
    required_support:
    - 蒼
    quorum: 1
    alternatives:
    - id: short
      label: 終盤の一台詞を短縮
      terms:
        台詞: 短縮
      statement: 終盤の一台詞を短くしたい。確認して返答してほしい。
    initial: short
    profiles:
      蓮:
        weights: {}
        constraints: {}
        minimum: 0
        requires: []
        support_line: 短縮案を確認しました。
        oppose_line: 元の台詞を残したいです。
        unknown_line: 今は判断を保留します。
      蒼:
        weights: {}
        constraints: {}
        minimum: 0
        requires: []
        support_line: 短縮案を確認しました。
        oppose_line: 元の台詞を残したいです。
        unknown_line: 今は判断を保留します。
    requires_state: {}
    outcomes:
      approved:
        台詞相談結果: approved
      rejected:
        台詞相談結果: rejected
      deferred:
        台詞相談結果: deferred
    decision_lines:
      approved: 台詞の相談へ返答した。
      rejected: 台詞の相談へ返答した。
      deferred: 台詞の相談へ返答した。
    request_line: 台詞の短縮について返答がほしい。
