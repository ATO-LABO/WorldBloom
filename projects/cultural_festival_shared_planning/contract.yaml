assumptions:
- 文化祭当日の朝だけを扱う新しい入力。旧3日版と授業の行動列は保存し、この版へ自動移行しない。
- 人物の性格・初期位置・所持品・初期知識は元の六人を保持。目的の優先順位と操作的定義は仮設定。
- 初期の約束の提案と双方の了承だけをchoices.jsonで明示。08:45以後の移動・制作・納品・相談・待機は共通計画が選ぶ。
- 初期の作業進捗0は全員に公開済みという追加仮定。以後の遠隔の作業完了を自動共有しない。
- 出演の約束の判定対象は準備を整えて15時から15分待機したこと。演技内容や上演成功は判定しない。
- 灯の「演劇を潰す意図はない」は他者を妨害する目的へ変えず、人物説明として保持。
- 台詞短縮の相談は共通審議プロトコルで相手から実際の返答を受けることとして定義。承認だけを相談の成功条件にしない。
- この版の準備担当は衣装・主役稽古=蒼、相手役稽古=蓮、音響=紗季。共同作業の速度合成や作業への協力依頼は追加しない。
