name: 桃太郎＋3（新形式）
time:
  days: 20
  slots:
  - 朝
  - 昼
  - 夕方
  - 夜
protagonist: 桃太郎
antagonist: 鬼
zones:
- name: 村
  note: おじいさんとおばあさんが暮らす旅の起点
- name: 道中
  note: 桃太郎が犬・猿・キジと出会う道
- name: 森
  note: 船を作る木材が採れる林
- name: 海
  note: 鬼ヶ島へ渡る船を組み立てる海辺
- name: 鬼ヶ島
  note: 鬼が宝物を守る固定の島
- name: 街
  note: 商人が行き交う町
routes:
  村:
  - to: 道中
  道中:
  - to: 村
  - to: 森
  - to: 海
  - to: 街
  森:
  - to: 道中
  海:
  - to: 道中
  - to: 鬼ヶ島
    cost: 4
    requires_item: 船
  鬼ヶ島:
  - to: 海
    cost: 4
    requires_item: 船
  街:
  - to: 道中
movement:
  action_weight: 2.5
  hop_decay: 0.6
  destination_weights:
    村: 1.0
    道中: 2.2
    森: 1.5
    海: 1.2
    鬼ヶ島: 0.8
    街: 1.3
stamina:
  default_max: 10.0
  default_recover_per_slot: 1.0
  exhausted_ratio: 0.2
  default_action_cost: 1.0
  passive_recovery: false
  action_cost_adjustments: {}
companionship:
  threshold: 0.6
  weight: 2.0
  drift:
  - between:
    - 犬
    - 猿
    per_slot: -0.03
  infight_desertion: -0.5
  drill_bond: 0.05
permission:
  restricted_weight: 0.15
gapengine:
  action_graph: templates/momotaro_plus3/action_graph.yaml
  effects: templates/momotaro_plus3/effects.yaml
phase1:
  open_bonus: 0.5
  negotiate_threshold: 0.3
  sacrifice_rewards:
    asset_base: 8
    bond_stress: -3
    bond_phase: 決意
disguises:
- id: momotaro_merchant
  subject: 桃太郎
  as: 旅の商人
  when: zone(self) == '海'
trials:
- id: monkey_shortcut_trial
  giver: 猿
  requires:
    stance: 0.4
    item: きびだんご
  grants:
    fact: 猿の知恵
- id: brother_letter_trial
  transfer_item: true
  giver: 鬼の弟
  requires:
    stance: 0.4
    item: きびだんご
  grants:
    item: 弟の手紙
- id: fisherman_ferry
  giver: 漁師
  requires:
    stance: 0.4
  grants:
    item: 船
phase_rules:
- id: after_crossing
  when: '''越境'' in phase'
  disable:
  - train
- id: otouto_neutral_fight_lock
  when: self == '鬼の弟' and stance(self, 桃太郎) > -0.2
  disable:
  - fight
awareness_per_encounter: 0.15
pulls:
  pursue: 1.5
  pursue_from_day: 4
  deliver: 3.0
  gather: 2.0
  craft: 3.0
  labor: 2.0
thresholds:
- id: 出発
  when: zone(self) != '村'
- id: 越境
  when: zone(self) == '鬼ヶ島'
items:
- name: きびだんご
  give:
    receiver_affinity: 0.5
    giver_affinity: 0.1
    shared_affinity: 0.15
  price:
    小判: 1
  shop_zone: 街
- name: 木材
  sources:
  - type: investigate
    zone: 森
    count: 1
    max: 2
- name: 縄
  sources:
  - type: investigate
    zone: 村
    count: 2
    max: 2
- name: 小判
  sources:
  - type: labor
    zone: 街
    count: 1
    max: 8
    stamina: 3
  lootable: true
  give:
    receiver_affinity: 0.2
    giver_affinity: 0.0
    ineffective_for:
    - animal
- name: 鉄砲
  price:
    小判: 3
  shop_zone: 街
  lootable: true
  modifier:
    id: item:鉄砲
    value: 50
    kind: item
    visible: true
- name: 弟の手紙
  display_name: 手紙
  lootable: true
  modifier:
    id: item:弟の手紙
    value: 3
    kind: item
    visible: true
- name: 鬼ヶ島の宝物
  display_name: 宝物
  lootable: true
  objective: true
- name: 金棒
  lootable: true
  modifier:
    id: item:金棒
    value: 40
    kind: item
    visible: false
    lethal: true
    lethal_chance: 0.5
- name: 船
  made_from:
    木材: 2
    縄: 1
  requires:
    knowledge: 造船術
  craft_zone: 海
  lootable: false
  vehicle: true
  access:
    mode: owner
    allow:
    - companions
facts:
- id: 造船術
  label: 船の組み方を知っている
  secrecy: 0.2
  share_min_affinity: 0.3
- id: 猿の知恵
  label: 猿が知る鬼ヶ島の抜け道
- id: 弟の消息
  label: 鬼には生き別れの弟がいて、森で木こりをしている
  sources:
  - type: investigate
    zone: 村
    count: 2
- id: oni_weakness
  label: 鬼の力の要は{value}だ
  values:
  - 金棒
  - 火
  - 塩
  secrecy: 0.4
  share_min_affinity: 0.0
  act_threshold: 0.6
- id: treasure_thief
  label: 宝を奪ったのは{value}だ
  values:
  - 鬼
  - 猿
  - 犬
  secrecy: 1.0
  act_threshold: 0.5
- id: elder_testimony
  label: おじいさんは宝を奪ったのは鬼だと証言した
  sources:
  - type: investigate
    agent: おじいさん
    count: 2
  implies:
    fact: treasure_thief
    value: 鬼
    confidence: 0.5
- id: road_gossip
  label: 道中では猿が宝を奪ったと噂されている
  sources:
  - type: investigate
    zone: 道中
    count: 2
  implies:
    fact: treasure_thief
    value: 猿
    confidence: 0.4
- id: 金棒の由来
  label: 鬼の力は金棒に支えられている
  secret_of: 鬼
  secrecy: 0.3
  share_min_affinity: 0.0
  sources:
  - type: investigate
    zone: 鬼ヶ島
    count: 1
  implies:
    fact: oni_weakness
    value: 金棒
    confidence: 0.8
- id: 耐火の痕跡
  label: 鬼は火を恐れていない
  secrecy: 0.2
  share_min_affinity: 0.0
  sources:
  - type: investigate
    agent: 鬼
    count: 2
  refutes:
    fact: oni_weakness
    value: 火
    confidence: 0.7
truth:
  oni_weakness: 金棒
  treasure_thief: 鬼
default_strength_prior: 50
contest:
  tau: 10.0
  epsilon: 5.0
vitality:
  allow_death: true
  revive_after: 4
  ally_speedup: 1
  revive_base_penalty: 2.0
  lethal_exempt:
  - 桃太郎
grief:
  stress: 1.0
  affinity_to_killer: -0.6
ending:
- id: homecoming_shared
  when: holds(桃太郎, 鬼ヶ島の宝物) and zone(桃太郎) == '村' and '還元' in phase
  label: 宝を村へ還元し、皆で喜びを分かち合った
  deliver:
    subject: 桃太郎
    item: 鬼ヶ島の宝物
    zone: 村
- id: homecoming
  when:
    agent: 桃太郎
    goal: attained
  label: 鬼退治を果たし、宝を村へ持ち帰った
- id: purpose_mvz6xmq3_1
  label: 達成条件1
  when: (zone("桃太郎") == "村" and holds("桃太郎", "鬼ヶ島の宝物"))
target_ending:
- purpose_mvz6xmq3_1
scheduled_events:
- id: departure_day
  day: 1
  slot: 朝
  targets:
  - 桃太郎
  label: 旅立ちの朝
  stress_delta: 0.3
  force_action:
    verb: move
    args:
    - 道中
- id: otouto_grudge_seed
  day: 1
  slot: 朝
  targets:
  - 鬼の弟
  label: 兄を思う弟の胸騒ぎ
  force_action:
    verb: plant
    args:
    - brother_grudge
daily_events:
  chance: 0.35
  events:
  - id: warm_kibidango
    label: おばあさんのきびだんごで元気づいた
    weight: 3
    stress_delta: -0.4
  - id: mountain_view
    label: 峠から遠い山々を眺めた
    weight: 2
    stress_delta: -0.3
  - id: steep_path
    label: 険しい山道に足を取られた
    weight: 2
    stress_delta: 0.5
  - id: sudden_storm
    label: 突然の嵐に見舞われた
    weight: 1
    stress_delta: 0.7
