name: 約束した復旧資材を届ける
time:
  days: 1
  slots:
  - 09:00
protagonist: 整備士
antagonist: 通信員
zones:
- name: 操舵室
- name: 補給区画
routes:
  操舵室:
  - to: 補給区画
    cost: 1
  補給区画:
  - to: 操舵室
    cost: 1
ending:
- id: observed
  when: 'False'
  label: Observation only
target_ending: observed
scheduled_events: []
slot_execution:
  mode: calendar_promises_v2
  contract: contract.yaml
  subjects:
  - id: 整備士
    path: subjects/ada.yaml
  - id: 通信員
    path: subjects/bo.yaml
planning:
  version: 1
  actors:
  - 整備士
  max_depth: 12
  max_nodes: 2048
concerns:
  version: 2
  conditions:
  - id: 復旧協力の約束履行
    label: 復旧協力の約束履行
    mode: achieve
    visibility: observed
    test:
      kind: promise
      promise: 復旧協定
      version: 1
      statuses:
      - fulfilled
  - id: 復旧協力の約束履行の失効
    label: 約束が履行できなくなった
    mode: achieve
    visibility: observed
    test:
      kind: promise
      promise: 復旧協定
      version: 1
      statuses:
      - breached
      - cancelled
      - renegotiated
goal_rules:
  version: 2
  definitions:
  - condition: 復旧協力の約束履行
    success:
      condition: 復旧協力の約束履行
    failure:
      condition: 復旧協力の約束履行の失効
    period:
      start:
        date: '2026-11-01'
        time: 08:00
      end:
        date: '2026-11-01'
        time: 09:20
